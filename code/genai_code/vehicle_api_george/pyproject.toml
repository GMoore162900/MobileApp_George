[project]
name = "vehicle-api-george"
version = "0.1.0"
description = "FastAPI CRUD API for vehicle manufacturers and their vehicles (in-memory)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
